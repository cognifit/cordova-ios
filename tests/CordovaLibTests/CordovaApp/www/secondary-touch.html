<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; background: #d9eaff; font: 18px sans-serif; }
button { position: absolute; top: 148px; left: 40px; right: 40px; height: 60px; }
#route { top: 218px; }
</style>
<button id="secondary">Tap secondary</button>
<button id="route">Return to main</button>
<script>
let taps = 0, cancels = 0;
const report = () => secondaryWebView.post('touchCounts', {taps, cancels});
document.getElementById('secondary').onclick = () => { taps++; report(); };
document.getElementById('secondary').addEventListener('touchcancel', () => { cancels++; report(); });
document.getElementById('route').onclick = () => secondaryWebView.post('routeMain', null);
</script>
